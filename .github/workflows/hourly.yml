name: Hourly data refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python3 fetch.py
      - run: python3 gen_og.py
      - run: python3 build.py
      - name: Commit and push if changed
        run: |
          git config user.name "Taskmarket Live"
          git config user.email "kaycevoxx@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Hourly data refresh: $(python3 -c "import json; print(json.load(open('docs/data.json'))['fetchedAt'])")"
            git push
          fi
